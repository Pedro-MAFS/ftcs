server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: token-gateway-server
  datasource:
    # 可与其它业务共库（表均为 token_*）。真实地址/账号请用 application-local.yml 或 MYSQL_*，勿把密钥写进本文件。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:token_gateway}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration
    # 与共库方隔离；由 TokenFlywayHistoryBootstrap 预建（兼容 TiDB）
    table: token_flyway_schema_history
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true

token-gateway:
  upstream:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  user-center:
    issuer-uri: ${UC_ISSUER_URI:https://user.ai-utills.com}
  observability:
    access-log-enabled: true
    access-log-exclude:
      - /health
      - /actuator/health
      - /actuator/health/**

# UC Resource Server（US-G0-05/14）。正式联调须 mvn -Puc-rs，且 OAUTH_JWK_KEY 与 AS 完全一致（HS256）。
com.mfs.user.oauth:
  issuer: ${UC_ISSUER_URI:https://user.ai-utills.com}
  jwk-key: ${OAUTH_JWK_KEY:}
  resource:
    protected-patterns:
      - /v1/keys/**
      - /v1/auth/**
      - /health
      - /actuator/health
      - /actuator/health/**

logging:
  file:
    # Log4j2 RollingFile 目录（相对进程工作目录；可用环境变量 LOGGING_FILE_PATH 覆盖）
    path: ${LOGGING_FILE_PATH:logs}
  level:
    root: INFO
    com.mfs.tokengateway: INFO
