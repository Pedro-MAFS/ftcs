server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: token-gateway-server
  datasource:
    # 可与其它业务共库（表均为 token_*）。真实地址/账号请用 application-local.yml 或 MYSQL_*，勿把密钥写进本文件。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:token_gateway}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration
    # 与共库方隔离；由 TokenFlywayHistoryBootstrap 预建（兼容 TiDB）
    table: token_flyway_schema_history
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true

token-gateway:
  upstream:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      # US-G0-03：模型白名单（区分大小写）
      allowed-models:
        - deepseek-v4-flash
        - deepseek-v4-pro
      connect-timeout: 5s
      read-timeout: 120s
      # US-G0-04：流式
      stream-read-timeout: 300s
      stream-emitter-timeout: 300s
      stream-pool-size: 64
  user-center:
    issuer-uri: ${UC_ISSUER_URI:https://user.ai-utills.com}
  key:
    # US-G0-06：API Key 哈希 pepper（生产必填；未配置则 rotate 返回 500）
    pepper: ${GATEWAY_KEY_PEPPER:}
  settlement:
    # US-G0-10：异步结算（多实例认领 + 同用户合并扣减）
    enabled: true
    fixed-delay: 60s
    initial-delay: 10s
    batch-size: 50
    claim-timeout: 5m
    instance-id:  dev-1
  billing:
    # US-G0-11：余额预检；balance_li >= min-balance-li 才放行（默认 1 → 拒绝 <= 0）
    min-balance-li: 1
    # US-G3-06：充值短时 ticket TTL（新签发；须在 [60s, 24h]）
    recharge-ticket-ttl: ${GATEWAY_RECHARGE_TICKET_TTL:300s}
  wechat-pay:
    # US-G3-01：微信 Native；默认关闭。开启时须配齐商户号/AppID/证书等（见 application-local.yml.example）
    enabled: ${GATEWAY_WECHAT_PAY_ENABLED:false}
    mch-id: ${WECHAT_MCH_ID:}
    app-id: ${WECHAT_APP_ID:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    merchant-serial-no: ${WECHAT_MCH_SERIAL_NO:}
    private-key-path: ${WECHAT_MCH_PRIVATE_KEY_PATH:}
    # 新商户无平台证书：填微信支付公钥（商户平台 API 安全下载）及公钥 ID
    public-key-path: ${WECHAT_PUBLIC_KEY_PATH:}
    public-key-id: ${WECHAT_PUBLIC_KEY_ID:}
    notify-url: ${WECHAT_NOTIFY_URL:}
    description: 官方服务预付费充值
    code-url-expires-in: 7200s
    # US-G3-03：定时查单补单（须 wechat-pay.enabled=true 才实际跑）
    sync-job:
      enabled: ${GATEWAY_WECHAT_SYNC_JOB_ENABLED:true}
      fixed-delay: 60s
      initial-delay: 30s
      batch-size: 20
      min-age: 2m
      max-age: 48h
      expire-unpaid: true
  observability:
    access-log-enabled: true
    access-log-exclude:
      - /health
      - /actuator/health
      - /actuator/health/**

# UC Resource Server（US-G0-05/14）。默认依赖 RS；OAUTH_JWK_KEY 须与 AS 完全一致（HS256）。
com.mfs.user.oauth:
  issuer: ${UC_ISSUER_URI:https://user.ai-utills.com}
  jwk-key: ${OAUTH_JWK_KEY:}
  resource:
    protected-patterns:
      - /v1/keys/**
      - /v1/auth/**
      - /v1/billing/recharge/ticket
      - /health
      - /actuator/health
      - /actuator/health/**

logging:
  file:
    # Log4j2 RollingFile 目录（相对进程工作目录；可用环境变量 LOGGING_FILE_PATH 覆盖）
    path: ${LOGGING_FILE_PATH:logs}
  level:
    root: INFO
    com.mfs.tokengateway: INFO
