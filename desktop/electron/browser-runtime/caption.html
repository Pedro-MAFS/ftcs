<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>内置浏览器</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1a1a;
        color: #e4e4e4;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .bar {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        box-sizing: border-box;
        background: #1a1a1a;
        border-bottom: 1px solid #3a3a3a;
        user-select: none;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4ade80;
        flex: 0 0 auto;
      }
      .meta {
        min-width: 0;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .title,
      .url {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .title {
        max-width: 42%;
        font-size: 12px;
        font-weight: 600;
      }
      .url {
        flex: 1;
        font-size: 11px;
        color: #6b6b6b;
      }
      button {
        height: 22px;
        padding: 0 7px;
        border: 0;
        border-radius: 4px;
        background: #262626;
        color: #e4e4e4;
        font: 500 11px/1 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        cursor: pointer;
      }
      button:hover {
        background: #2a2a2a;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <span class="dot" aria-hidden="true"></span>
      <div class="meta">
        <span class="title" id="title">内置浏览器</span>
        <span class="url" id="url">尚未打开页面</span>
      </div>
      <button type="button" id="restore">还原</button>
      <button type="button" id="collapse">收起</button>
    </header>
    <script>
      const titleEl = document.getElementById('title')
      const urlEl = document.getElementById('url')

      function render(state) {
        titleEl.textContent = (state && state.title) || '内置浏览器'
        urlEl.textContent = (state && state.url) || '尚未打开页面'
      }

      function setMode(mode) {
        console.log('FTCS_CHROME ' + JSON.stringify({ type: 'mode', mode: mode }))
        if (window.ftcsCaption) window.ftcsCaption.setMode(mode)
      }

      document.getElementById('restore').addEventListener('click', () => setMode('thumbnail'))
      document.getElementById('collapse').addEventListener('click', () => setMode('hidden'))
      document.addEventListener('contextmenu', (event) => event.preventDefault())

      if (window.ftcsCaption) window.ftcsCaption.onState(render)
      render({ title: '内置浏览器', url: '尚未打开页面' })
    </script>
  </body>
</html>
